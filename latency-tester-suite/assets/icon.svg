<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#22305a"/>
      <stop offset="1" stop-color="#0a0f22"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ea0ff"/>
      <stop offset="1" stop-color="#22e0d0"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff4b0"/>
      <stop offset="0.45" stop-color="#ffc933"/>
      <stop offset="1" stop-color="#ff7a00"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb52e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffb52e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="52.5" fill="none" stroke="#5f79c4" stroke-opacity="0.55" stroke-width="3"/>
  <!-- glow behind the bolt -->
  <circle cx="128" cy="132" r="92" fill="url(#glow)"/>
  <!-- timer ring with a gap at the top, like a stopwatch -->
  <path d="M 128 40 A 90 90 0 1 1 84.5 51.6" fill="none" stroke="url(#ring)" stroke-width="15" stroke-linecap="round"/>
  <!-- crown / tick of the stopwatch -->
  <rect x="112" y="16" width="32" height="13" rx="6" fill="#7fb4ff"/>
  <rect x="122" y="27" width="12" height="12" fill="#7fb4ff"/>
  <!-- lightning bolt -->
  <path d="M 148 60 L 88 142 L 121 142 L 106 204 L 172 116 L 137 116 Z" fill="url(#bolt)" stroke="#fff2b8" stroke-width="3" stroke-linejoin="round"/>
</svg>
