[package]
name = "latency-tester"
version = "1.0.0"
edition = "2021"
description = "Cross-platform latency testing suite for CPU, memory, GPU, and input latency"
authors = ["Latency Tester Suite"]
license = "MIT"

[dependencies]
# GUI and windowing (eframe pulls in winit + glow)
eframe = { version = "0.29", default-features = true }
egui = "0.29"
egui_extras = { version = "0.29", features = ["default"] }

# Vulkan
ash = { version = "0.37", default-features = false, features = ["loaded"] }
rspirv = "0.13"

# System information
sysinfo = "0.30"
raw-cpuid = "11"
num_cpus = "1.16"

# High-resolution timing
instant = "0.1"
libc = "0.2"

# Cryptography for result verification
sha2 = "0.10"
ed25519-dalek = "2"
rand = "0.8"
hex = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }

# Cross-platform utilities
anyhow = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
crossbeam = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytemuck = "1.25.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Performance",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.28", features = ["sched"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 2
