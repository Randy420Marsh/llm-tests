<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 780" width="1320" height="780" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ar1f6feb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="arc0392b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="ar2c3e50" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2c3e50"/></marker><marker id="arc99000" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c99000"/></marker></defs>
<rect width="1320" height="780" fill="#ffffff"/>
<text x="30" y="38" font-size="22" text-anchor="start" fill="#1b1f27" font-weight="bold">Keyboard robot: how everything is wired</text>
<text x="30" y="62" font-size="14" text-anchor="start" fill="#5b6470" font-weight="normal">Blue = 5 V logic signals, red = +12 V, dark = ground, dashed yellow = light or mechanical contact. Driver detail: solenoid_driver.svg</text>
<rect x="500" y="190" width="300" height="350" rx="10" fill="#eef3fb" stroke="#1b1f27" stroke-width="2.5"/>
<text x="650.0" y="224" font-size="20" text-anchor="middle" fill="#1b1f27" font-weight="bold">Arduino Pro Micro</text>
<text x="650.0" y="246" font-size="12.5" text-anchor="middle" fill="#5b6470" font-weight="normal">ATmega32U4, 5 V / 16 MHz</text>
<text x="650.0" y="264" font-size="12.5" text-anchor="middle" fill="#5b6470" font-weight="normal">USB to the PC (serial 115200 baud)</text>
<text x="650.0" y="458" font-size="13" text-anchor="middle" fill="#5b6470" font-weight="normal">latency_rig.ino</text>
<text x="650.0" y="490" font-size="12" text-anchor="middle" fill="#5b6470" font-weight="normal">+5 V and GND from here also feed</text>
<text x="650.0" y="506" font-size="12" text-anchor="middle" fill="#5b6470" font-weight="normal">the sensor board and the LED</text>
<line x1="470" y1="305" x2="500" y2="305" stroke="#1b1f27" stroke-width="2.5"/>
<line x1="470" y1="355" x2="500" y2="355" stroke="#1b1f27" stroke-width="2.5"/>
<line x1="470" y1="455" x2="500" y2="455" stroke="#1b1f27" stroke-width="2.5"/>
<text x="510" y="310" font-size="13" text-anchor="start" fill="#1b1f27" font-weight="normal"><tspan font-weight="bold">D4</tspan>  LIGHT  (comparator output)</text>
<text x="510" y="360" font-size="13" text-anchor="start" fill="#1b1f27" font-weight="normal"><tspan font-weight="bold">A0</tspan>  LIGHT_A  (photodiode node)</text>
<text x="510" y="460" font-size="13" text-anchor="start" fill="#1b1f27" font-weight="normal"><tspan font-weight="bold">D10</tspan>  CAL_LED</text>
<line x1="800" y1="305" x2="830" y2="305" stroke="#1b1f27" stroke-width="2.5"/>
<text x="790" y="310" font-size="13" text-anchor="end" fill="#1b1f27" font-weight="normal"><tspan font-weight="bold">D9</tspan>  OUT</text>
<line x1="800" y1="395" x2="830" y2="395" stroke="#1b1f27" stroke-width="2.5"/>
<text x="790" y="400" font-size="13" text-anchor="end" fill="#1b1f27" font-weight="normal"><tspan font-weight="bold">D6</tspan>  SENSE</text>
<line x1="650.0" y1="540" x2="650.0" y2="570" stroke="#1b1f27" stroke-width="2.5"/>
<text x="658.0" y="532" font-size="13" text-anchor="start" fill="#1b1f27" font-weight="bold">GND</text>
<rect x="60" y="95" width="330" height="60" rx="8" fill="#fffaf0" stroke="#1b1f27" stroke-width="2"/>
<text x="225.0" y="121" font-size="16" text-anchor="middle" fill="#1b1f27" font-weight="bold">Monitor</text>
<text x="225.0" y="143" font-size="12.5" text-anchor="middle" fill="#5b6470" font-weight="normal">white bar at the right edge of the test area</text>
<rect x="60" y="190" width="330" height="150" rx="8" fill="#f5f7fa" stroke="#1b1f27" stroke-width="2"/>
<text x="225.0" y="216" font-size="16" text-anchor="middle" fill="#1b1f27" font-weight="bold">Light-sensor board</text>
<text x="225.0" y="238" font-size="12.5" text-anchor="middle" fill="#5b6470" font-weight="normal">BPW34S photodiode, 47 kΩ load</text>
<text x="225.0" y="256" font-size="12.5" text-anchor="middle" fill="#5b6470" font-weight="normal">LM393 comparator, 10 kΩ trimmer</text>
<text x="225.0" y="274" font-size="12.5" text-anchor="middle" fill="#5b6470" font-weight="normal">470 kΩ hysteresis, 4.7 kΩ pull-up</text>
<text x="225.0" y="292" font-size="12.5" text-anchor="middle" fill="#5b6470" font-weight="normal">shaded from room light</text>
<rect x="60" y="390" width="330" height="100" rx="8" fill="#f5f7fa" stroke="#1b1f27" stroke-width="2"/>
<text x="225.0" y="416" font-size="16" text-anchor="middle" fill="#1b1f27" font-weight="bold">Calibration LED</text>
<text x="225.0" y="438" font-size="12.5" text-anchor="middle" fill="#5b6470" font-weight="normal">5 mm LED + 330 Ω, driven by D10</text>
<text x="225.0" y="456" font-size="12.5" text-anchor="middle" fill="#5b6470" font-weight="normal">aimed into the sensor shroud</text>
<polyline points="225,155 225,190" fill="none" stroke="#c99000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#arc99000)"/>
<text x="233" y="176" font-size="12" text-anchor="start" fill="#c99000" font-weight="normal">light from the screen</text>
<polyline points="225,390 225,340" fill="none" stroke="#c99000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#arc99000)"/>
<text x="233" y="370" font-size="12" text-anchor="start" fill="#c99000" font-weight="normal">LED light (calibration)</text>
<polyline points="390,305 470,305" fill="none" stroke="#1f6feb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar1f6feb)"/>
<text x="445" y="297" font-size="12" text-anchor="middle" fill="#1f6feb" font-weight="normal">digital</text>
<polyline points="390,355 470,355" fill="none" stroke="#1f6feb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar1f6feb)"/>
<text x="445" y="347" font-size="12" text-anchor="middle" fill="#1f6feb" font-weight="normal">analog</text>
<polyline points="470,455 390,455" fill="none" stroke="#1f6feb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar1f6feb)"/>
<rect x="890" y="190" width="330" height="150" rx="8" fill="#f5f7fa" stroke="#1b1f27" stroke-width="2"/>
<text x="1055.0" y="216" font-size="16" text-anchor="middle" fill="#1b1f27" font-weight="bold">Driver board</text>
<text x="1055.0" y="238" font-size="12.5" text-anchor="middle" fill="#5b6470" font-weight="normal">TC4420 gate driver, VDD = +12 V</text>
<text x="1055.0" y="256" font-size="12.5" text-anchor="middle" fill="#5b6470" font-weight="normal">R1 1 kΩ, R2 10 kΩ, C1 4.7 µF, C2 100 µF</text>
<text x="1055.0" y="274" font-size="12.5" text-anchor="middle" fill="#5b6470" font-weight="normal">R3 10 Ω, R4 100 kΩ, Q1 MOSFET</text>
<text x="1055.0" y="292" font-size="12.5" text-anchor="middle" fill="#5b6470" font-weight="normal">D1 flyback (+ optional 24 V zener)</text>
<rect x="890" y="390" width="330" height="100" rx="8" fill="#f5f7fa" stroke="#1b1f27" stroke-width="2"/>
<text x="1055.0" y="416" font-size="16" text-anchor="middle" fill="#1b1f27" font-weight="bold">Solenoid L1 (12 V, push type)</text>
<text x="1055.0" y="438" font-size="12.5" text-anchor="middle" fill="#5b6470" font-weight="normal">plunger tip 0.5 – 1 mm above the key</text>
<rect x="890" y="540" width="330" height="110" rx="8" fill="#fffaf0" stroke="#1b1f27" stroke-width="2"/>
<text x="1055.0" y="566" font-size="16" text-anchor="middle" fill="#1b1f27" font-weight="bold">Reference switch</text>
<text x="1055.0" y="588" font-size="12.5" text-anchor="middle" fill="#5b6470" font-weight="normal">same model as your keyboard, under the plunger,</text>
<text x="1055.0" y="606" font-size="12.5" text-anchor="middle" fill="#5b6470" font-weight="normal">only for calibration. One contact to D6 (SENSE),</text>
<text x="1055.0" y="624" font-size="12.5" text-anchor="middle" fill="#5b6470" font-weight="normal">the other to GND. Pull-up on: type u, then S</text>
<polyline points="830,305 890,305" fill="none" stroke="#1f6feb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar1f6feb)"/>
<text x="850" y="297" font-size="12" text-anchor="middle" fill="#1f6feb" font-weight="normal">IN</text>
<polyline points="1055,340 1055,390" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arc0392b)"/>
<text x="1063" y="370" font-size="12" text-anchor="start" fill="#c0392b" font-weight="normal">coil current, switched by Q1</text>
<polyline points="1055,490 1055,540" fill="none" stroke="#c99000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#arc99000)"/>
<text x="1063" y="520" font-size="12" text-anchor="start" fill="#c99000" font-weight="normal">plunger presses the key / switch</text>
<polyline points="830,395 860,395 860,590 890,590" fill="none" stroke="#1f6feb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar1f6feb)"/>
<rect x="890" y="675" width="330" height="80" rx="8" fill="#f5f7fa" stroke="#1b1f27" stroke-width="2"/>
<text x="1055.0" y="701" font-size="16" text-anchor="middle" fill="#1b1f27" font-weight="bold">12 V DC adapter, 1 A</text>
<text x="1055.0" y="723" font-size="12.5" text-anchor="middle" fill="#5b6470" font-weight="normal">its own supply: never from USB or a Pro Micro pin</text>
<polyline points="1220,715 1260,715 1260,265 1220,265" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arc0392b)"/>
<polyline points="1260,440 1220,440" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arc0392b)"/>
<text x="1250" y="668" font-size="12" text-anchor="end" fill="#c0392b" font-weight="bold">+12 V to the driver board and the solenoid</text>
<polyline points="890,715 650,715 650,570" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar2c3e50)"/>
<text x="640" y="705" font-size="12" text-anchor="end" fill="#2c3e50" font-weight="normal">GND: adapter minus, Pro Micro GND and the driver-board ground meet at one point</text>
</svg>