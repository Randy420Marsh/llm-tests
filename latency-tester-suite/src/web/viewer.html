<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latency Tester — Results</title>
<style>
  :root { --bg:#16181d; --panel:#1e2128; --panel2:#262a33; --line:#343a46; --text:#dfe3ea; --dim:#8b93a3; --accent:#5ab0ff; --ok:#4cc38a; --bad:#ff6b6b; --warn:#f0b429; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { color:var(--dim); font-size:12px; }
  #layout { display:flex; min-height:calc(100vh - 50px); }
  #side { width:300px; flex:none; background:var(--panel); border-right:1px solid var(--line); overflow:auto; max-height:calc(100vh - 50px); position:sticky; top:50px; }
  #main { flex:1; min-width:0; padding:16px 20px 60px; }
  .item { padding:8px 12px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; gap:8px; align-items:flex-start; }
  .item:hover { background:var(--panel2); }
  .item.sel { background:#22344a; }
  .item .t { font-size:12px; color:var(--dim); }
  .badge { display:inline-block; padding:0 6px; border-radius:9px; font-size:11px; background:#38414f; margin-right:4px; }
  .badge.ok { background:#1f4d3a; color:var(--ok); } .badge.bad { background:#552a2a; color:var(--bad); } .badge.warn { background:#4d3e14; color:var(--warn); }
  h2 { font-size:17px; margin:26px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--line); }
  h3 { font-size:14px; margin:16px 0 6px; color:var(--dim); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:10px 0; }
  .grid { display:grid; grid-template-columns:max-content 1fr; gap:3px 16px; }
  .grid .k { color:var(--dim); }
  .row { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; margin:6px 0; }
  label.chk { display:inline-flex; align-items:center; gap:5px; cursor:pointer; user-select:none; }
  button, select, input[type=text] { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:5px; padding:3px 9px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.small { padding:0 7px; font-size:12px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { padding:3px 10px; text-align:right; white-space:nowrap; border-bottom:1px solid #2a2f39; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align:left; }
  th { color:var(--dim); font-weight:500; position:sticky; top:0; background:var(--panel); }
  .scroll { overflow:auto; max-height:420px; border:1px solid var(--line); border-radius:6px; }
  svg text { fill:var(--dim); font-size:11px; }
  .chartwrap { background:#12141a; border:1px solid var(--line); border-radius:8px; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 14px; padding:6px 10px; }
  .sw { width:11px; height:11px; border-radius:2px; display:inline-block; }
  pre { background:#12141a; padding:10px; border-radius:6px; overflow:auto; max-height:360px; font-size:12px; }
  .warn { color:var(--warn); } .bad { color:var(--bad); } .ok { color:var(--ok); }
  #empty { color:var(--dim); padding:40px 0; text-align:center; }
  a { color:var(--accent); }
  .swl { vertical-align:middle; margin-right:3px; }
  label.chip { display:inline-flex; align-items:center; gap:4px; padding:1px 9px; border:1px solid var(--line); border-radius:13px; background:var(--panel2); cursor:pointer; user-select:none; }
  label.chip.on { border-color:var(--accent); background:#22344a; }
  label.chip input { display:none; }
  .serlist { max-height:150px; overflow:auto; padding:2px 0; flex:1 1 100%; display:flex; flex-wrap:wrap; gap:3px 14px; }
  .sergrid { display:grid; gap:1px 12px; align-items:center; max-height:280px; overflow:auto; flex:1 1 100%; padding:2px 0; }
  .sergrid .sgrow { display:contents; }
  .sergrid .chk { justify-content:center; }
  .sergrid button.small { text-align:left; }
  .ctools { display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; margin:8px 0 4px; }
  .ctools .hint { color:var(--dim); font-size:12px; }
  .ctools .zinfo { color:var(--accent); font-size:12px; }
  .chartbox { position:relative; width:100%; height:clamp(330px, 54vh, 600px); background:#12141a; border:1px solid var(--line); border-radius:8px; overflow:hidden; cursor:grab; touch-action:none; user-select:none; }
  .chartbox.big { height:84vh; }
  .chartbox.drag { cursor:grabbing; }
  .chartbox svg { display:block; }
  .tip { position:absolute; pointer-events:none; background:#0b0d11ee; border:1px solid var(--line); border-radius:6px; padding:4px 9px; font-size:12px; line-height:1.35; white-space:nowrap; z-index:5; }
  .bars { padding:6px 10px; }
  .bh { color:var(--dim); font-size:12px; margin:8px 0 2px; text-transform:uppercase; letter-spacing:.04em; }
  .bar { display:grid; grid-template-columns:minmax(110px,260px) 1fr 120px; gap:10px; align-items:center; padding:2px 0; }
  .bar .bn { text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar .bt { background:#1b1f27; border-radius:3px; height:16px; }
  .bar .bt i { display:block; height:100%; border-radius:3px; min-width:2px; }
  .bar .bv { color:var(--dim); font-size:12px; }
  .flatwarn { background:#3a2f12; border:1px solid #6b5416; border-radius:6px; padding:6px 10px; margin:6px 0; color:var(--warn); font-size:13px; }
  @media (max-width:800px){ #layout{flex-direction:column;} #side{width:auto;position:static;max-height:220px;} }
</style>
</head>
<body>
<header>
  <h1>⚡ Latency Tester — Results</h1>
  <span class="sub" id="source"></span>
  <span style="flex:1"></span>
  <button id="btnRefresh" title="Reload the list from the server">Refresh</button>
</header>
<div id="layout">
  <div id="side"><div class="row" style="padding:8px 12px;margin:0"><select id="typeFilter"><option value="">all types</option></select><label class="chk"><input type="checkbox" id="compareMode"> compare</label></div><div id="list"></div></div>
  <div id="main"><div id="empty">Loading…</div></div>
</div>
<script id="embedded" type="application/json">/*__EMBEDDED__*/null</script>
<script>
'use strict';
// ------------------------------------------------------------------------------------------------
// helpers
// ------------------------------------------------------------------------------------------------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PALETTE = ['#56b4e9','#e69f00','#009e73','#f0e442','#cc79a7','#d55e00','#9696ff','#78dc78','#ff8282','#b482ff','#5adcdc','#c8c8c8'];
const colorOf = i => PALETTE[i % PALETTE.length];
function humanSize(b) { if (b >= 2**30) return (b/2**30).toFixed(b % 2**30 ? 1 : 0)+' GB'; if (b >= 2**20) return (b/2**20).toFixed(0)+' MB'; if (b >= 1024) return (b/1024).toFixed(0)+' KB'; return b+' B'; }
function fmt(v, unit) {
  if (v === null || v === undefined || Number.isNaN(v)) return '—';
  const a = Math.abs(v);
  // small values keep three significant digits (0.000123 ms, not 0.000)
  const s = Number.isInteger(v) && a < 1e9 ? String(v) : a >= 1000 ? v.toFixed(0) : a >= 10 ? v.toFixed(1) : a >= 1 ? v.toFixed(2) : a >= 0.1 ? v.toFixed(3) : a === 0 ? '0' : v.toFixed(Math.min(9, 2 - Math.floor(Math.log10(a))));
  return unit ? s + ' ' + unit : s;
}
function patternLabel(p) {
  if (typeof p === 'string') return p;
  const k = Object.keys(p || {})[0];
  return k ? (p[k] && p[k].stride ? `${k}(${p[k].stride} B)` : k) : '?';
}
const isPow2 = n => Number.isInteger(n) && n > 0 && n < 2**53 && (n & (n - 1)) === 0 || (Number.isInteger(n) && n > 0 && n < 2**53 && Math.log2(n) % 1 === 0);

// ------------------------------------------------------------------------------------------------
// metric catalogues (mirrors the desktop app's Results & Graphs tab)
// ------------------------------------------------------------------------------------------------
const TELEMETRY = [
  ['cpu_temp_max','CPU temp (max)','°C'],['cpu_temp_avg','CPU temp (avg)','°C'],['hottest_core','Hottest core','°C'],['coolest_core','Coolest core','°C'],['core_temp_avg','Core temp (avg of all cores)','°C'],
  ['cpu_freq','CPU clock (avg)','MHz'],['cpu_usage','CPU load (avg)','%'],['ram_used','RAM used (max)','MB'],
  ['gpu_temp','GPU temp (max)','°C'],['gpu_util','GPU load (avg)','%'],['gpu_clock','GPU clock (avg)','MHz'],
  ['gpu_power','GPU power (max)','W'],['vram_used','VRAM used (max)','MB'],['vram_total','VRAM total','MB'],
  ['others_cpu','Other programs: CPU (avg)','%'],['others_gpu','Other programs: GPU (avg)','%'],
];
function telemetryValues(t) {
  const v = {};
  if (!t || !t.samples) return v;
  const put = (k, x) => { if (x !== null && x !== undefined) v[k] = x; };
  put('cpu_temp_max', t.cpu_temp_max_c); put('cpu_temp_avg', t.cpu_temp_avg_c);
  if (t.core_temp_max_c && t.core_temp_max_c.length) {
    put('hottest_core', Math.max(...t.core_temp_max_c.map(c => c[1])));
    put('coolest_core', Math.min(...t.core_temp_max_c.map(c => c[1])));
  }
  put('core_temp_avg', t.core_temp_avg_c);
  put('cpu_freq', t.cpu_freq_avg_mhz); put('cpu_usage', t.cpu_usage_avg_pct); put('ram_used', t.ram_used_max_mb);
  put('gpu_temp', t.gpu_temp_max_c); put('gpu_util', t.gpu_util_avg_pct); put('gpu_clock', t.gpu_clock_avg_mhz);
  put('gpu_power', t.gpu_power_max_w); put('vram_used', t.vram_used_max_mb); put('vram_total', t.vram_total_mb);
  put('others_cpu', t.others_cpu_avg_pct); put('others_gpu', t.others_gpu_avg_pct);
  // not a chart value: which programs they were ("chrome.exe 12 % CPU")
  if (t.others_top && t.others_top.length) v.__others = t.others_top.filter(o => o[1] >= 0.5 || o[2] >= 0.5).map(o => `${o[0]} ${[o[1] >= 0.5 ? fmt(o[1]) + ' % CPU' : '', o[2] >= 0.5 ? fmt(o[2]) + ' % GPU' : ''].filter(Boolean).join(' / ')}`).join(', ');
  return v;
}
// the timing-suite modes time the app's own wake-ups; their old names suggested device input
const MODE_LABELS = { MouseMove: 'Sleep 100 µs wake-up', RawInput: 'Sleep 50 µs wake-up', PollingRate: 'Poll loop (sleep 100 µs)', Jitter: '1 ms busy-wait jitter', MouseClick: 'Click (simulated)', KeyPress: 'Key press (simulated)' };
const KINDS = {
  memory: {
    title: 'Memory', logX: true, xLabel: 'buffer size', xFmt: v => humanSize(2 ** v),
    // run times are kept in ns; the column picks ns / µs / ms from its values (see autoTimeUnits)
    metrics: [['ns_per_access','Latency / access','time'],['bandwidth','Bandwidth','GB/s'],['avg_run','Avg run','time'],['p99_run','p99 run','time'],['min_run','Best run','time'],['runs','Runs',''],['passes','Passes per run','']].concat(TELEMETRY),
    rows(sec) { return (sec.results || []).map(r => ({
      series: `${patternLabel(r.pattern)} · ${r.thread_count}T` + (r.cores && !String(r.cores).startsWith('All cores') ? ` · ${r.cores}` : ''),
      x: Math.log2(r.size), xLabel: humanSize(r.size),
      values: Object.assign({ ns_per_access: r.ns_per_access, bandwidth: r.bandwidth_gb_s, avg_run: r.latency_ns, p99_run: r.percentile_99_ns, min_run: r.min_latency_ns, runs: r.iterations, passes: r.passes_per_run ?? 1 }, telemetryValues(r.telemetry)),
    })); },
  },
  cpu: {
    title: 'CPU',
    metrics: [['mcalls','Throughput','M calls/s'],['mcalls_thread','Throughput per thread','M calls/s'],['ns_per_call','Time per call','time'],['run_spread','Run-to-run spread','%'],['clock','Clock','MHz'],['this_core_temp','Temp of this core','°C'],['threads','Threads','']].concat(TELEMETRY),
    // per-core runs next to all-core runs: the all-core total (24 threads) would dwarf every core, so
    // the chart starts on the per-thread value; the total stays in the table and the value chips
    defaultChart: rows => rows.some(r => r.core !== undefined) && rows.some(r => r.core === undefined) ? 'mcalls_thread' : 'mcalls',
    rows(sec) {
      const res = sec.results || [];
      const topo = sec.core_topology || {};
      const pSet = new Set(topo.performance_cores || []), eSet = new Set(topo.efficiency_cores || []);
      const cls = c => pSet.size && eSet.size ? (pSet.has(c) ? 'P' : eSet.has(c) ? 'E' : '') : '';
      const singleOf = r => { const mask = Number(r.core_mask); return Number.isFinite(mask) && mask > 0 && mask < 2**53 && Math.log2(mask) % 1 === 0 ? Math.log2(mask) : null; };
      const anySingle = res.some(r => singleOf(r) !== null);
      const multiKeys = [...new Set(res.filter(r => singleOf(r) === null).map(r => `${r.thread_count}|${r.cores || ''}`))];
      return res.map(r => {
        const single = singleOf(r);
        const threads = Math.max(1, r.thread_count || 1);
        const v = Object.assign({ mcalls: r.operations_per_second/1e6, mcalls_thread: r.operations_per_second/1e6/threads, ns_per_call: r.latency_ns, threads: r.thread_count }, telemetryValues(r.telemetry));
        if (r.frequency_mhz > 0) v.clock = r.frequency_mhz;
        const runs = (r.iteration_results || []).filter(it => it.duration_ns > 0).map(it => it.operations / it.duration_ns * 1e3);
        if (runs.length > 1) { const m = runs.reduce((a, b) => a + b, 0) / runs.length; v.run_spread = m > 0 ? Math.sqrt(runs.reduce((a, b) => a + (b - m) ** 2, 0) / runs.length) / m * 100 : 0; }
        if (single !== null) {
          if (r.telemetry && r.telemetry.core_temp_max_c) { const t = r.telemetry.core_temp_max_c.find(c => c[0] === single); if (t) v.this_core_temp = t[1]; }
          const c = cls(single);
          return { series: String(r.workload), x: single, core: single, coreClass: c, xLabel: `Core ${single}` + (c ? ` · ${c}` : ''), values: v, runs };
        }
        const allCores = !r.cores || String(r.cores).startsWith('All cores');
        if (!anySingle) {
          // thread-count sweep: threads on the x axis
          return { series: String(r.workload) + (allCores ? '' : ` · ${r.cores}`), x: threads, xLabel: `${threads} thread${threads === 1 ? '' : 's'}`, values: v, runs };
        }
        // next to per-core runs: own line, own slot left of core 0 (never drawn at a core's position)
        const where = allCores ? 'all cores' : r.cores;
        return { series: `${r.workload} · ${threads}T ${where}`, x: -2 - multiKeys.indexOf(`${r.thread_count}|${r.cores || ''}`), xLabel: `${threads}T ${where}`, values: v, runs };
      });
    },
  },
  gpu: {
    title: 'GPU (Vulkan compute)', logX: true, xLabel: 'elements per dispatch', xFmt: v => humanCount(2 ** v),
    metrics: [['avg_ms','Avg dispatch','time'],['p95_ms','p95 dispatch','time'],['p99_ms','p99 dispatch','time'],['min_ms','Best dispatch','time'],['gops','Throughput','GOPS']].concat(TELEMETRY),
    rows(sec) { return (sec.results || []).map(r => ({
      series: 'GPU compute', x: Math.log2(r.workload_size), xLabel: `${r.workload_size} elements`,
      values: Object.assign({ avg_ms: r.avg_latency_ms * 1e6, p95_ms: r.percentile_95_ms * 1e6, p99_ms: r.percentile_99_ms * 1e6, min_ms: r.min_latency_ms * 1e6, gops: r.throughput_geops }, telemetryValues(r.telemetry)),
    })); },
  },
  gpu3d: {
    title: '3D graphics (wgpu, rendered off screen)',
    metrics: [['fps_avg','Average FPS','FPS'],['fps_1pct','1 % low','FPS'],['fps_01pct','0.1 % low','FPS'],['ft_avg','Frame time avg','time'],['ft_p99','Frame time p99','time'],['ft_max','Worst frame','time'],['lat_avg','Latency (submit → done)','time'],['lat_p99','Latency p99','time'],['gpu_ms','GPU time per frame','time']].concat(TELEMETRY),
    rows(sec) { return (sec.results || []).map(r => ({
      series: `${String(r.detail || '').split(' (')[0]} · MSAA ${r.msaa}×`, x: r.height, xLabel: r.name,
      values: Object.assign({ fps_avg: r.fps_avg, fps_1pct: r.fps_1pct_low, fps_01pct: r.fps_01pct_low, ft_avg: r.frametime_avg_ms * 1e6, ft_p99: r.frametime_p99_ms * 1e6, ft_max: r.frametime_max_ms * 1e6, lat_avg: r.latency_avg_ms * 1e6, lat_p99: r.latency_p99_ms * 1e6 }, r.gpu_time_avg_ms != null ? { gpu_ms: r.gpu_time_avg_ms * 1e6 } : {}, telemetryValues(r.telemetry)),
    })); },
  },
  gpu3d_frames: {
    title: '3D graphics: every frame (spikes are stutters)',
    metrics: [['ft','Frame time','time']],
    rows(sec) {
      const rows = [];
      (sec.results || []).forEach(r => (r.frametimes_ms || []).forEach((t, i) => rows.push({ series: `${r.name} (${r.width}×${r.height})`, x: i + 1, xLabel: `frame ${i + 1}`, values: { ft: t * 1e6 } })));
      return rows;
    },
  },
  input_timing_suite: {
    title: 'OS timing suite (no device input: sleep / wake-up precision)',
    metrics: [['avg_ms','Average','time'],['p99_ms','p99','time'],['max_ms','Worst','time'],['jitter_ms','Jitter','time'],['polling_hz','Loop rate','Hz'],['samples','Samples','']].concat(TELEMETRY),
    rows(sec) { return (sec.results || []).map((r, i) => ({
      series: MODE_LABELS[r.mode] || String(r.mode), x: r.core ?? i, xLabel: r.core !== null && r.core !== undefined ? `core ${r.core}` : 'OS scheduled',
      values: Object.assign({ avg_ms: r.avg_latency_ms * 1e6, p99_ms: r.percentile_99_ms * 1e6, max_ms: r.max_latency_ms * 1e6, jitter_ms: r.jitter_ms * 1e6, samples: r.sample_count, ...(r.polling_rate_hz ? { polling_hz: r.polling_rate_hz } : {}) }, telemetryValues(r.telemetry)),
    })); },
  },
  mouse_polling: {
    title: 'Mouse polling (you moved the mouse)',
    metrics: [['rate_hz','Polling rate','Hz'],['nominal_hz','Set rate','Hz'],['median_us','Median interval','time'],['jitter_us','Interval jitter (std dev)','time'],['p99_us','p99 interval','time'],['on_time','On time (±10 %)','%'],['skipped','Late / merged','%'],['counts','Counts per report (avg)',''],['reports','Reports','']],
    rows(sec) { return (sec.runs || []).map((r, i) => ({
      series: 'Mouse polling', x: i + 1, xLabel: `run ${i + 1}`,
      values: { rate_hz: r.rate_hz, nominal_hz: r.nominal_hz, median_us: r.interval_median_us * 1e3, jitter_us: r.jitter_us * 1e3, p99_us: r.interval_p99_us * 1e3, on_time: r.on_time_pct, skipped: r.skipped_pct, counts: r.counts_avg, reports: r.reports },
    })); },
  },
  reflex_game: {
    title: 'Reflex game (click the red circles)',
    metrics: [['time','Time per circle','time']],
    rows(sec) {
      const rows = [];
      (sec.runs || []).forEach((g, gi) => (g.times_ms || []).forEach((t, i) => rows.push({ series: `Game ${gi + 1} · ${g.mode} · ${Math.round(g.radius)} px · ${fmt(g.accuracy_pct)} % accuracy`, x: i + 1, xLabel: `circle ${i + 1}`, values: { time: t * 1e6 } })));
      return rows;
    },
  },
  input_trials: {
    title: 'Click / key-press trials',
    metrics: [['trial_ms','Trial latency','time'],['trial_corrected_ms','Trial latency (rig-corrected)','time']],
    rows(sec) {
      const rows = [];
      (sec.runs || []).forEach((run, ri) => {
        const s = run.summary || {};
        const name = `${s.kind === 'KeyPress' ? 'Keyboard press' : 'Mouse click'} · ${s.robot ? 'robot' : 'human'} #${ri + 1}`;
        const cal = run.calibration_used || {};
        const off = s.robot && cal.subtract_robot ? (s.kind === 'KeyPress' ? cal.keyboard_robot_ms : cal.mouse_robot_ms) : 0;
        const off2 = s.robot && cal.subtract_display ? cal.display_ms : 0;
        (s.samples_ms || []).forEach((ms, i) => rows.push({ series: name, x: i + 1, xLabel: `trial ${i + 1}`, values: Object.assign({ trial_ms: ms * 1e6 }, s.robot ? { trial_corrected_ms: (ms - off - off2) * 1e6 } : {}) }));
      });
      return rows;
    },
  },
};

// ------------------------------------------------------------------------------------------------
// state
// ------------------------------------------------------------------------------------------------
const state = {
  list: [],             // [{name, timestamp, test_type, app_version, valid, message}]
  docs: new Map(),      // name -> parsed VerifiedResult
  selected: [],         // names
  hiddenSeries: new Set(), hiddenCols: new Set(), chartMetrics: {}, filters: {}, wheelZoom: false,
  optsBy: {},
  timeUnit: 'ns', sensorSel: null, sensorFilter: '', phaseOpacity: 0.18, phaseHidden: new Set(),
  serverMode: false,
};

const optsOf = k => (state.optsBy[k] ??= { zeroY: true, logY: false, markers: true });

async function loadList() {
  const emb = JSON.parse($('#embedded').textContent || 'null');
  if (emb) {
    state.serverMode = false;
    $('#source').textContent = 'static report · ' + emb.length + ' result(s)';
    $('#btnRefresh').style.display = 'none';
    state.list = emb.map(e => e.meta);
    emb.forEach(e => state.docs.set(e.meta.name, e.doc));
  } else {
    state.serverMode = true;
    const res = await fetch('/api/results');
    state.list = await res.json();
    $('#source').textContent = 'live from ' + location.host + ' · ' + state.list.length + ' result(s)';
  }
  const types = [...new Set(state.list.map(m => m.test_type))].sort();
  $('#typeFilter').innerHTML = '<option value="">all types</option>' + types.map(t => `<option>${esc(t)}</option>`).join('');
  renderList();
  if (!state.selected.length && state.list.length) select(state.list[0].name, false);
  else render();
}

async function getDoc(name) {
  if (state.docs.has(name)) return state.docs.get(name);
  // names are limited to [A-Za-z0-9._+-] by the server, so no URL encoding is needed ('+' would become %2B)
  const r = await fetch('/api/result/' + name);
  if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
  const doc = await r.json();
  state.docs.set(name, doc);

function renderList() {
  const filter = $('#typeFilter').value;
  const items = state.list.filter(m => !filter || m.test_type === filter);
  $('#list').innerHTML = items.length ? items.map(m => {
    const sel = state.selected.includes(m.name);
    const v = m.valid === true ? '<span class="badge ok">✓ signed</span>' : m.valid === false ? `<span class="badge bad" title="${esc(m.message)}">✗ invalid</span>` : '';
    return `<div class="item ${sel ? 'sel' : ''}" data-name="${esc(m.name)}"><div><div><span class="badge">${esc(m.test_type)}</span>${v}</div><div class="t">${esc((m.timestamp || '').replace('T', ' ').slice(0, 19))} · v${esc(m.app_version || '?')}</div></div></div>`;
  }).join('') : '<div style="padding:14px;color:var(--dim)">No results found.</div>';
  document.querySelectorAll('.item').forEach(el => el.onclick = () => select(el.dataset.name, $('#compareMode').checked));
}

async function select(name, multi) {
  if (multi) {
    const i = state.selected.indexOf(name);
    if (i >= 0) state.selected.splice(i, 1); else state.selected.push(name);
  } else state.selected = [name];
  renderList();
  try {
    await Promise.all(state.selected.map(getDoc));
    render();
  } catch (e) {
    $('#main').innerHTML = `<div id="empty" class="bad">Could not load the selected result: ${esc(e.message)}</div>`;
  }
}

        if (q[0] < L - 4 || q[0] > L + pw + 4 || q[1] < T - 4 || q[1] > T + ph + 4) continue;
        this.hit.push({ x: q[0], y: q[1], p: q[2], line: l, li });
        if (drawMarkers) markers += markerSvg(l.shape, +q[0].toFixed(1), +q[1].toFixed(1), 3.3, l.color);
        if (s.marks && s.marks.has(l.series + '|' + q[2][0])) markers += `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="8" fill="none" stroke="#ff5d5d" stroke-width="1.8"/>`;
      }
    });
    g += `<g clip-path="url(#${sid})">${body}${markers}</g><g id="ov" clip-path="url(#${sid})"></g>`;
    if (s.legend && s.legend.length) {
      const rowH = 15, lw = Math.min(pw - 20, Math.max(...s.legend.map(e => e.label.length)) * 6.3 + 48);
      g += `<g><rect x="${L + 8}" y="${T + 6}" width="${lw}" height="${s.legend.length * rowH + 6}" rx="5" fill="#12141ad9" stroke="#343a46"/>` + s.legend.map((e, i) => {
        const y = T + 6 + 3 + i * rowH + rowH / 2;
        return `<line x1="${L + 14}" x2="${L + 38}" y1="${y}" y2="${y}" stroke="${e.color}" stroke-width="2" ${e.dash ? `stroke-dasharray="${e.dash}"` : ''}/><text x="${L + 44}" y="${y + 4}" style="fill:var(--text)">${esc(e.label)}${s.axes.length > 1 ? (e.axis === 0 ? '  ◀' : '  ▶') : ''}</text>`;
      }).join('') + '</g>';
    }
    this.host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
    this.drawOverlay(); this.updateInfo();
  }
  drawOverlay() {
    const ov = this.host.querySelector('#ov'); if (!ov) return;
    const { L, T, pw, ph } = this.geo; let h = '';
    if (this.hlSeries !== null) {
      this.spec.lines.forEach((l, li) => {
        if (l.series !== this.hlSeries) return;
        const pts = this.screen.get(li) || []; if (pts.length < 1) return;
        h += `<polyline fill="none" stroke="${l.color}" stroke-width="3.4" stroke-linejoin="round" ${l.dash ? `stroke-dasharray="${l.dash}"` : ''} points="${pts.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ')}"/>`;
      });
      if (this.hlPoint) h += `<circle cx="${this.hlPoint.x}" cy="${this.hlPoint.y}" r="6.5" fill="none" stroke="#fff" stroke-width="1.6"/>`;
    }
    if (this.drag && this.drag.mode === 'box' && this.drag.last) {
      const a = this.drag.start, b = this.drag.last;
      h += `<rect x="${Math.min(a.x, b.x)}" y="${Math.min(a.y, b.y)}" width="${Math.abs(a.x - b.x)}" height="${Math.abs(a.y - b.y)}" fill="#5ab0ff33" stroke="#5ab0ff"/>`;
    }
    ov.innerHTML = h;
  }
  updateInfo() {
    const z = document.querySelector(`[data-zinfo="${CSS.escape(this.spec.id)}"]`); if (!z) return;
    const fx = this.view.x ? (this.fx[1] - this.fx[0]) / (this.view.x[1] - this.view.x[0]) : 1, fy = this.view.y ? 1 / (this.view.y[1] - this.view.y[0]) : 1;
    z.textContent = fx > 1.01 || fy > 1.01 ? `zoom ×${fx.toFixed(1)} horizontal · ×${fy.toFixed(1)} vertical` : '';
  }
  svgText() {
    const svg = this.host.querySelector('svg'); if (!svg) return '';
    const c = svg.cloneNode(true); c.querySelector('#ov')?.remove();
    c.insertAdjacentHTML('afterbegin', `<style>text{fill:#8b93a3;font:11px system-ui,sans-serif}</style><rect width="100%" height="100%" fill="#12141a"/>`);
    return new XMLSerializer().serializeToString(c);
  }
}

function mountCharts(root) {
  root.querySelectorAll('.chartbox[data-chart]').forEach(el => {
    const id = el.dataset.chart, spec = pendingSpecs.get(id); if (!spec) return;
    liveCharts.get(id)?.destroy();
    liveCharts.set(id, new Chart(el, spec));
  });
  root.querySelectorAll('[data-z]').forEach(b => b.onclick = () => {
    const c = liveCharts.get(b.dataset.for); if (!c) return;
    const a = b.dataset.z;
    if (a === 'in') c.zoomCenter(0.6); if (a === 'out') c.zoomCenter(1 / 0.6); if (a === 'reset') c.reset();
    if (a === 'big') { c.el.classList.toggle('big'); b.textContent = c.el.classList.contains('big') ? '⤡ shrink' : '⤢ expand'; c.draw(); }
    if (a === 'svg') download(c.spec.id.replace(/\W/g, '_') + '.svg', c.svgText(), 'image/svg+xml');
  });
  root.querySelectorAll('[data-wheel]').forEach(cb => cb.onchange = () => { state.wheelZoom = cb.checked; document.querySelectorAll('[data-wheel]').forEach(o => o.checked = cb.checked); });
  root.querySelectorAll('[data-hl]').forEach(el => {
    el.onmouseenter = () => liveCharts.get(el.dataset.for)?.setHighlight(el.dataset.hl);
    el.onmouseleave = () => liveCharts.get(el.dataset.for)?.setHighlight(null);
  });
}

function chartTools(id) {
  return `<div class="ctools"><button class="small" data-z="in" data-for="${esc(id)}" title="Zoom in">＋</button><button class="small" data-z="out" data-for="${esc(id)}" title="Zoom out">－</button>` +
    `<button class="small" data-z="reset" data-for="${esc(id)}">⟲ reset zoom</button><button class="small" data-z="big" data-for="${esc(id)}">⤢ expand</button><button class="small" data-z="svg" data-for="${esc(id)}" title="Save the chart as it is shown">SVG</button>` +
    `<label class="chk" title="Otherwise hold Ctrl while scrolling"><input type="checkbox" data-wheel ${state.wheelZoom ? 'checked' : ''}>zoom with the mouse wheel</label>` +
    `<span class="hint">Ctrl + wheel or ＋/－ = zoom · drag = pan · Shift + drag = box zoom · double-click = reset · hover a point for its value</span><span class="zinfo" data-zinfo="${esc(id)}"></span></div>`;
}

function barsHtml(items, unit) {
  const max = Math.max(...items.map(i => i.value), 0) || 1;
  return '<div class="bars">' + items.map(it => `<div class="bar"><span class="bn" title="${esc(it.name)}">${esc(it.name)}</span><span class="bt"><i style="width:${Math.max(0.3, it.value / max * 100).toFixed(2)}%;background:${it.color}"></i></span><span class="bv">${fmt(it.value, unit)}</span></div>`).join('') + '</div>';
}

// ------------------------------------------------------------------------------------------------
// section rendering
// ------------------------------------------------------------------------------------------------
function toCsv(rows, cols) {
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  return ['series,at,' + cols.map(c => q(`${c[1]} (${c[2]})`)).join(',')]
    .concat(rows.map(r => [q(r.series), q(r.xLabel)].concat(cols.map(c => r.values[c[0]] ?? '')).join(','))).join('\n');
}
function download(name, text, type = 'text/plain') {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); URL.revokeObjectURL(a.href);
}

// A temperature that is identical in every test is not a live reading (Windows: fixed ACPI thermal zone)
function flatTempWarning(rows) {
  const v = rows.map(r => r.values.cpu_temp_max).filter(x => x != null);
  if (v.length >= 6 && Math.max(...v) - Math.min(...v) < 0.05) {
    return `<div class="flatwarn">⚠ CPU temperature reads ${fmt(v[0])} °C in all ${v.length} tests. If the CPU was busy that is almost certainly a fixed ACPI thermal-zone value, not the real CPU temperature. On Windows, real per-core temperatures need LibreHardwareMonitor or OpenHardwareMonitor running while the tests run.</div>`;
  }
  return '';
}

// Every time value is held in ns (memory / CPU are saved in ns; GPU / input are saved as f64 ms, converted
// here without losing precision). All time columns and charts use one unit, picked at the top of the page.
const TIME_UNITS = { ns: 1, 'µs': 1e3, ms: 1e6 };
function autoTimeUnits(metrics, rows) {
  const div = TIME_UNITS[state.timeUnit] || 1;
  return metrics.map(m => {
    if (m[2] !== 'time') return m;
    if (div !== 1) rows.forEach(r => { if (r.values[m[0]] != null) r.values[m[0]] /= div; });
    return [m[0], m[1], state.timeUnit];
  });
}

// "12T" after "2T", "Core 10" after "Core 9"
const natCmp = new Intl.Collator('en', { numeric: true, sensitivity: 'base' }).compare;
// "StreamAdd · 12T" -> { base: 'StreamAdd', col: '12T' }; lines without a thread count keep col ''
function splitSeries(s) {
  const seg = s.split(' · '), k = seg.findIndex(x => /^\d+T\b/.test(x));
  return k < 0 ? { base: s, col: '' } : { base: seg.filter((_, i) => i !== k).join(' · '), col: seg[k] };
}
// Line switches: a grid (one row per test, one column per thread count, row and column names toggle the
// whole group) when the lines have both, otherwise a plain list
function seriesPicker(kindKey, series, hid, q) {
  const cell = (s, inner) => `<label class="chk" data-serlabel="${esc(s.toLowerCase())}" data-hl="${esc(s)}" data-for="chart_${kindKey}" title="${esc(s)}" ${q && !s.toLowerCase().includes(q) ? 'style="display:none"' : ''}><input type="checkbox" data-ser="${esc(s)}" ${hid(s) ? '' : 'checked'}>${styleSwatch(series.indexOf(s))}${inner}</label>`;
  const parts = series.map(s => ({ s, ...splitSeries(s) }));
  const bases = [...new Set(parts.map(p => p.base))].sort(natCmp), cols = [...new Set(parts.map(p => p.col))].sort(natCmp);
  if (bases.length < 2 || cols.length < 2) return '<div class="serlist">' + series.map(s => cell(s, esc(s))).join('') + '</div>';
  let h = `<div class="sergrid" style="grid-template-columns:auto repeat(${cols.length}, auto)"><div class="sgrow"><span style="color:var(--dim);font-size:12px">click a name to switch its group</span>` +
    cols.map(c => `<button class="small" data-sercol="${esc(c)}" title="Show / hide every ${esc(c || 'single-thread')} line">${esc(c || '—')}</button>`).join('') + '</div>';
  for (const b of bases) {
    const mine = parts.filter(p => p.base === b);
    const lbl = mine.map(p => p.s.toLowerCase()).join('|');
    h += `<div class="sgrow" data-serlabel="${esc(lbl)}" ${q && !lbl.includes(q) ? 'style="display:none"' : ''}><button class="small" data-serrow="${esc(b)}" title="Show / hide every ${esc(b)} line">${esc(b)}</button>` +
      cols.map(c => { const p = mine.find(x => x.col === c); return p ? cell(p.s, '') : '<span></span>'; }).join('') + '</div>';
  }
  return h + '</div>';
}

// ------------------------------------------------------------------ unusual values
// Points that stand out from their neighbours on a line, cores that differ from cores of their own kind,
// and results whose repeated runs disagree. Thresholds are deliberately loose: cache-level steps and
// P-vs-E differences are expected, only what stands out from its own surroundings is listed.
function findAnomalies(kindKey, rows) {
  const out = [], med = a => { const s = [...a].sort((x, y) => x - y), h = Math.floor(s.length / 2); return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };
  const add = (r, why, bad) => out.push({ series: r.series, x: r.x, xLabel: r.xLabel, why, bad });
  const bySeries = new Map(); rows.forEach(r => { if (!bySeries.has(r.series)) bySeries.set(r.series, []); bySeries.get(r.series).push(r); });
  // GPU: throughput, since the dispatch time grows with the size by design
  const spikeKey = { memory: 'ns_per_access', gpu: 'gops', input_timing_suite: 'avg_ms' }[kindKey];
  const spikeName = { memory: 'time per access', gpu: 'throughput', input_timing_suite: 'average' }[kindKey];
  if (spikeKey) for (const rs of bySeries.values()) {
    const pts = rs.filter(r => r.values[spikeKey] > 0).sort((a, b) => a.x - b.x);
    if (pts.length < 4) continue;
    const val = q => q.values[spikeKey];
    const show = v => spikeKey === 'ns_per_access' ? fmt(v) + ' ns' : spikeKey === 'gops' ? fmt(v) + ' GOPS' : fmt(v / 1e6) + ' ms';
    pts.forEach((r, i) => {
      // the value the line would have here: between its neighbours on a log scale (geometric mean), or
      // extrapolated from the next two at either end; so steady trends and cache steps are not flagged
      const v = val(r), near = [pts[i - 1], pts[i + 1]].filter(Boolean).map(val);
      const around = [pts[i - 2], pts[i - 1], pts[i + 1], pts[i + 2]].filter(Boolean).map(val);
      const edge = near.length < 2;
      const exp = !edge ? Math.sqrt(near[0] * near[1]) : i === 0 ? val(pts[1]) ** 2 / val(pts[2]) : val(pts[i - 1]) ** 2 / val(pts[i - 2]);
      const f = edge ? 2.5 : 1.6;
      // a spike must also beat its direct neighbours; a dip must be below every point within two places
      if (v > exp * f && v > Math.max(...near) * 1.25) add(r, `${spikeName} ${(v / exp).toFixed(1)}× what the points around it suggest (${show(v)} vs ${show(exp)})`, v > exp * 3);
      else if (v < exp / (f + 0.5) && v < Math.min(...around) / 1.5) add(r, `${spikeName} ${(exp / v).toFixed(1)}× lower than the points around it suggest (${show(v)} vs ${show(exp)})`, v < exp / 3);
    });
  }
  if (kindKey === 'cpu') {
    const peers = new Map();
    rows.filter(r => r.core !== undefined).forEach(r => { const k = r.series + '|' + (r.coreClass || ''); if (!peers.has(k)) peers.set(k, []); peers.get(k).push(r); });
    for (const rs of peers.values()) {
      if (rs.length < 3) continue;
      const m = med(rs.map(r => r.values.mcalls));
      rs.forEach(r => {
        const d = m > 0 ? r.values.mcalls / m - 1 : 0, kind = r.coreClass ? r.coreClass + '-core' : 'core';
        if (Math.abs(d) > 0.08) add(r, `${Math.abs(d * 100).toFixed(0)}% ${d < 0 ? 'slower' : 'faster'} than the median ${kind}`, Math.abs(d) > 0.25);
      });
    }
    rows.forEach(r => { if (r.values.run_spread > 5) add(r, `runs vary ±${r.values.run_spread.toFixed(1)}% (something else used the core, or the clock changed)`, r.values.run_spread > 15); });
  }
  rows.forEach(r => {
    const v = r.values;
    // another program was busy: the result may be lower than the machine can do
    if ((v.others_cpu || 0) >= 8 || (v.others_gpu || 0) >= 8) {
      const what = (v.others_gpu || 0) > (v.others_cpu || 0) ? `${fmt(v.others_gpu)} % of the GPU` : `${fmt(v.others_cpu)} % of the CPU`;
      add(r, `other programs used ${what} during this test${v.__others ? ': ' + v.__others : ''}`, (v.others_cpu || 0) >= 25 || (v.others_gpu || 0) >= 25);
    }
    if (kindKey === 'memory' && v.p99_run > 0 && v.min_run > 0 && v.p99_run / v.min_run > 2) add(r, `unstable: slowest run ${(v.p99_run / v.min_run).toFixed(1)}× the best`, v.p99_run / v.min_run > 4);
    if (kindKey === 'gpu' && v.p99_ms > 0 && v.avg_ms > 0 && v.p99_ms / v.avg_ms > 2) add(r, `p99 dispatch ${(v.p99_ms / v.avg_ms).toFixed(1)}× the average`, v.p99_ms / v.avg_ms > 4);
    if (kindKey === 'gpu3d' && v.ft_p99 > 0 && v.ft_avg > 0 && v.ft_p99 / v.ft_avg > 2) add(r, `stutter: p99 frame ${(v.ft_p99 / v.ft_avg).toFixed(1)}× the average frame`, v.ft_p99 / v.ft_avg > 4);
    if (kindKey === 'input_timing_suite' && v.p99_ms > 0 && v.avg_ms > 0 && v.p99_ms / v.avg_ms > 1.5) add(r, `p99 ${(v.p99_ms / v.avg_ms).toFixed(1)}× the average`, v.p99_ms / v.avg_ms > 3);
  });
  return out;
}

function anomaliesHtml(kindKey, list) {
  if (!list.length) return `<div style="color:var(--dim);font-size:12px;margin:4px 0">✓ No unusual values: every point fits its neighbours and its runs agree.</div>`;
  const bad = list.filter(a => a.bad).length, MAX = 60;
  return `<details class="anoms" ${list.length <= 12 ? 'open' : ''}><summary class="${bad ? 'bad' : 'warn'}">⚠ ${list.length} unusual value${list.length === 1 ? '' : 's'}${bad ? ` (${bad} strong)` : ''}: ringed on the chart · hover one to highlight its line</summary>` +
    '<div class="scroll" style="max-height:260px"><table><thead><tr><th>Line</th><th>At</th><th>Why it stands out</th></tr></thead><tbody>' +
    list.slice(0, MAX).map(a => `<tr data-hl="${esc(a.series)}" data-for="chart_${kindKey}"><td>${esc(a.series)}</td><td>${esc(a.xLabel)}</td><td class="${a.bad ? 'bad' : 'warn'}">${esc(a.why)}</td></tr>`).join('') +
    (list.length > MAX ? `<tr><td colspan="3" style="color:var(--dim)">… and ${list.length - MAX} more</td></tr>` : '') + '</tbody></table></div></details>';
}

function kindSection(kindKey, entries) {
  // entries: [{label, sec}] one per selected result
  const kind = KINDS[kindKey];
  const multi = entries.length > 1;
  const rows = entries.flatMap(e => kind.rows(e.sec).map(r => multi ? { ...r, series: `[${e.label}] ${r.series}` } : r));
  const series = [...new Set(rows.map(r => r.series))].sort(natCmp);
  const metrics = autoTimeUnits(kind.metrics, rows).filter(m => rows.some(r => r.values[m[0]] !== undefined && r.values[m[0]] !== null));
  const hid = (k) => state.hiddenSeries.has(kindKey + ':' + k), hidc = (k) => state.hiddenCols.has(kindKey + ':' + k);
  const shownMetrics = metrics.filter(m => !hidc(m[0]));
  let chosen = (state.chartMetrics[kindKey] || []).filter(k => shownMetrics.some(m => m[0] === k));
  if (!chosen.length && shownMetrics.length) {
    const d = kind.defaultChart && kind.defaultChart(rows);
    chosen = [d && shownMetrics.some(m => m[0] === d) ? d : shownMetrics[0][0]];
  }
  const chosenMetrics = shownMetrics.filter(m => chosen.includes(m[0]));   // catalogue order keeps dashes stable
  const id = 'sec_' + kindKey, o = optsOf(kindKey);
  const visRows = rows.filter(r => !hid(r.series));
  const q = (state.filters[kindKey] || '').toLowerCase();
  let html = `<h2>${esc(kind.title)} <span class="badge">${rows.length} result rows</span></h2>`;
  if (kindKey === 'memory' && entries.some(e => e.sec.complete === false)) html += `<div class="warn">⚠ The run was stopped early: ${entries.map(e => e.sec.tests_done + ' of ' + e.sec.tests_planned + ' tests').join(', ')} were completed.</div>`;
  const anomalies = findAnomalies(kindKey, rows);
  html += anomaliesHtml(kindKey, anomalies);
  html += flatTempWarning(rows);
  html += `<div class="card" id="${id}">`;
  html += `<div class="row"><b>Lines:</b> <button class="small" data-act="ser-all">all</button><button class="small" data-act="ser-none">none</button><button class="small" data-act="ser-only" title="Show only the lines matching the filter">only matching</button>` +
    `<input type="text" data-serfilter placeholder="filter lines (e.g. Stream, 12T)" value="${esc(state.filters[kindKey] || '')}" style="min-width:200px"><span style="color:var(--dim);font-size:12px">${series.length - series.filter(hid).length} of ${series.length} shown</span>` +
    seriesPicker(kindKey, series, hid, q) + '</div>';
  html += `<details><summary>Show / hide values (columns)</summary><div class="row"><button class="small" data-act="col-all">all</button><button class="small" data-act="col-none">none</button><button class="small" data-act="col-perf">performance only</button><button class="small" data-act="col-sens">sensors only</button></div><div class="row">` +
    metrics.map(m => `<label class="chk"><input type="checkbox" data-col="${m[0]}" ${hidc(m[0]) ? '' : 'checked'}>${esc(m[1])} <span style="color:var(--dim)">(${esc(m[2])})</span></label>`).join('') + '</div></details>';
  const bySeries = new Map(); rows.forEach(r => { if (!bySeries.has(r.series)) bySeries.set(r.series, []); bySeries.get(r.series).push(r); });
  if (chosenMetrics.length) {
    const many = chosenMetrics.length > 1;
    const visCount = series.filter(s => !hid(s)).length;
    // one line only (e.g. the GPU test): colour by value, otherwise colour = line and dash = value
    const byValueColor = many && visCount === 1;
    const valueColor = mi => byValueColor ? PALETTE[mi % PALETTE.length] : '#c8ccd6';
    html += `<div class="row"><b>Chart values:</b> ` + shownMetrics.map(m => {
      const mi = chosenMetrics.indexOf(m), on = mi >= 0;
      return `<label class="chip ${on ? 'on' : ''}" title="Tick several to overlay them; values with different units get their own axis"><input type="checkbox" data-mchip="${m[0]}" ${on ? 'checked' : ''}>${on && many ? swatch(valueColor(mi), 'circle', DASHES[mi % DASHES.length]) : ''}${esc(m[1])} <span style="color:var(--dim)">(${esc(m[2])})</span></label>`;
    }).join('') + '</div>';
    html += `<div class="row"><b>Chart:</b><label class="chk"><input type="checkbox" data-opt="zeroY" ${o.zeroY ? 'checked' : ''}>start Y at 0</label><label class="chk"><input type="checkbox" data-opt="logY" ${o.logY ? 'checked' : ''}>log Y</label><label class="chk"><input type="checkbox" data-opt="markers" ${o.markers ? 'checked' : ''}>markers</label>` +
      (many ? '<span style="color:var(--dim);font-size:12px">one dash pattern per value · colours are the lines above · values with different units share the chart but each unit has its own axis (first on the left, others on the right)</span>' : '') + '</div>';
    const visSeries = series.filter(s => !hid(s));
    const singles = visSeries.length > 0 && visSeries.every(s => bySeries.get(s).length <= 1);
    if (singles) {
      // one value per line: bars read better than isolated dots; one block per chosen value
      html += '<div class="chartwrap">' + chosenMetrics.map(m => {
        const items = visSeries.map(s => ({ name: s, color: seriesStyle(series.indexOf(s)).color, value: (bySeries.get(s)[0].values[m[0]]) })).filter(i => i.value != null);
        return (chosenMetrics.length > 1 ? `<div class="bh" style="padding:0 10px">${esc(m[1])} (${esc(m[2])})</div>` : '') + barsHtml(items, m[2]);
      }).join('') + '</div>';
    } else {
      const units = [...new Set(chosenMetrics.map(m => m[2]))];
      const axes = units.map(u => { const ms = chosenMetrics.filter(m => m[2] === u); return { unit: u, label: ms.length <= 2 ? ms.map(m => m[1]).join(' · ') + (u ? ` (${u})` : '') : (u || 'value') }; });
      const lines = [];
      visSeries.forEach(s => {
        const st = seriesStyle(series.indexOf(s));
        chosenMetrics.forEach((m, mi) => {
          const pts = bySeries.get(s).filter(r => r.values[m[0]] != null).map(r => [r.x, r.values[m[0]], r.xLabel]).sort((a, b) => a[0] - b[0]);
          if (pts.length) lines.push({ series: s, metric: `${m[1]} (${m[2]})`, unit: m[2], name: s, color: byValueColor ? valueColor(mi) : st.color, shape: st.shape, dash: many ? DASHES[mi % DASHES.length] : st.dash, axis: units.indexOf(m[2]), pts });
        });
      });
      const xs = [...new Set(rows.map(r => r.x))].sort((a, b) => a - b);
      const labelAt = new Map(rows.map(r => [Math.round(r.x * 1000), r.xLabel]));
      const cid = 'chart_' + kindKey;
      pendingSpecs.set(cid, {
        id: cid, lines, axes, legend: many ? chosenMetrics.map((m, mi) => ({ label: `${m[1]} (${m[2]})`, color: valueColor(mi), dash: DASHES[mi % DASHES.length], axis: units.indexOf(m[2]) })) : null, ysig: chosenMetrics.map(m => m[0]).join('|') + '|' + o.zeroY + o.logY,
        xLabel: kind.xLabel || (kindKey === 'cpu' ? 'core' : ''), logY: o.logY, zeroY: o.zeroY, markers: o.markers,
        xFmt: kind.xFmt ? kind.xFmt : (v => labelAt.get(Math.round(v * 1000)) ?? fmt(v)),
        marks: new Set(anomalies.map(a => a.series + '|' + a.x)),
        xInt: !!kind.logX, xTicks: !kind.logX && xs.length <= 40 ? xs : undefined,
      });
      html += chartTools(cid) + `<div class="chartbox" data-chart="${cid}"></div>`;
    }
  } else html += '<div style="color:var(--dim)">All values are hidden.</div>';
  html += `<div class="row"><span style="color:var(--dim)">${visRows.length} rows</span><button class="small" data-act="csv">Copy CSV</button><button class="small" data-act="dl-csv">Download CSV</button></div>`;
  html += `<div class="scroll"><table><thead><tr><th>Line</th><th>At</th>${shownMetrics.map(m => `<th>${esc(m[1])} (${esc(m[2])})</th>`).join('')}</tr></thead><tbody>` +
    visRows.map(r => `<tr><td>${styleSwatch(series.indexOf(r.series))}${esc(r.series)}</td><td>${esc(r.xLabel)}</td>${shownMetrics.map(m => `<td>${fmt(r.values[m[0]])}</td>`).join('')}</tr>`).join('') + '</tbody></table></div>';
  html += '</div>';
  return { html, rows, shownMetrics, kindKey, series, metrics };
}

const SENSOR_DEFS = [
  ['cpu_package_c', 'CPU package', '°C'], ['hottest_core_c', 'Hottest core', '°C'], ['gpu_temp_c', 'GPU temperature', '°C'],
  ['cpu_freq_avg_mhz', 'CPU clock (avg)', 'MHz'], ['cpu_load_pct', 'CPU load', '%'], ['gpu_util_pct', 'GPU load', '%'],
  ['cpu_power_w', 'CPU package power', 'W'], ['gpu_power_w', 'GPU power', 'W'], ['ram_used_mb', 'RAM used', 'MB'], ['vram_used_mb', 'VRAM used', 'MB'],
];
// presets pick by unit, so they include every extra sensor of that kind (board, VRM, DIMM, PSU ...)
const SENSOR_PRESETS = {
  temps: ['Temperatures', d => d[2] === '°C'], fans: ['Fans', d => d[2] === 'RPM'], power: ['Power', d => d[2] === 'W'],
  volts: ['Voltages / currents', d => d[2] === 'V' || d[2] === 'A'], clocks: ['Clocks', d => d[2] === 'MHz'],
  load: ['Load', d => d[2] === '%'], mem: ['RAM / VRAM', d => d[2] === 'MB'],
};
// background of each test on the timeline
const PHASE_COLORS = { memory: '#e5484d', cpu: '#3e8bff', gpu: '#30c070', input: '#f0b429' };
const PHASE_NAMES = { memory: 'Memory', cpu: 'CPU', gpu: 'GPU', input: 'Input' };
const phaseColor = k => PHASE_COLORS[k] || '#9aa3b2';
// which test of its category a phase is ("CPU · IntegerAdd · 1 thread(s) · Core 3" -> "IntegerAdd")
const phaseKey = p => { const s = String(p.label || '').split(' · '); return s[p.kind === 'memory' ? 2 : 1] ?? s[s.length - 1] ?? ''; };
// shade i of n of a category colour: hue steps across ±30°, every other shade darker
function phaseShade(kind, i, n) {
  const hex = phaseColor(kind);
  if (n <= 1) return hex;
  const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  let h = 0; const sat = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  h = (h * 60 + ((i / (n - 1)) - 0.5) * 60 + 360) % 360;
  return `hsl(${h.toFixed(0)} ${(sat * 100).toFixed(0)}% ${((i % 2 ? l * 0.62 : l) * 100).toFixed(0)}%)`;
}
function phaseKeys(phases) {
  const m = {};
  phases.forEach(p => { const k = phaseKey(p); (m[p.kind] ??= []).includes(k) || m[p.kind].push(k); });
  return m;
}
const sensorValue = (p, key) => key.startsWith('x:') ? (p.sensors || {})[key.slice(2)] : p[key];

function sensorDefs(sec) {
  const tl = sec.timeline || [];
  const kinds = sec.sensor_kinds || {};
  const builtin = SENSOR_DEFS.filter(d => tl.some(p => p[d[0]] != null));
  const names = [...new Set(tl.flatMap(p => Object.keys(p.sensors || {})))].sort();
  const extra = names.map(n => ['x:' + n, n, (kinds[n] && kinds[n].unit) || '']);
  return builtin.concat(extra);
}

function sensorsSection(entries) {
  const sec = entries[0].sec;
  const tl = sec.timeline || [];
  const defs = sensorDefs(sec);
  if (!state.sensorSel) state.sensorSel = new Set(defs.filter(d => d[0] === 'cpu_package_c' || d[0] === 'hottest_core_c' || d[0] === 'gpu_temp_c').map(d => d[0]));
  let sel = defs.filter(d => state.sensorSel.has(d[0]));
  if (!sel.length && defs.length) sel = [defs[0]];
  const q = (state.sensorFilter || '').toLowerCase();
  let html = `<h2>Sensors over time <span class="badge">${sec.samples_recorded ?? tl.length} samples · ${defs.length} sensors</span></h2><div class="card">`;
  html += (sec.sources || []).map(n => `<div style="color:var(--dim);font-size:12px">• ${esc(n)}</div>`).join('');
  // a busy CPU whose package temperature never moves is not a live sensor
  const cp = tl.filter(p => p.cpu_package_c != null), busy = tl.filter(p => p.cpu_load_pct != null);
  if (cp.length >= 20 && Math.max(...cp.map(p => p.cpu_package_c)) - Math.min(...cp.map(p => p.cpu_package_c)) < 0.05 && busy.length && busy.reduce((a, p) => a + p.cpu_load_pct, 0) / busy.length > 25)
    html += `<div class="flatwarn">⚠ The CPU package temperature never changed (${fmt(cp[0].cpu_package_c)} °C) although the CPU was busy. That is a fixed ACPI thermal-zone value, not a live reading; run LibreHardwareMonitor or OpenHardwareMonitor for real temperatures.</div>`;
  html += '<div class="row"><b>Show:</b>' + Object.entries(SENSOR_PRESETS).filter(([, g]) => defs.some(g[1])).map(([k, g]) =>
    `<button class="small" data-spreset="${k}">${g[0]} (${defs.filter(g[1]).length})</button>`).join('') +
    '<button class="small" data-spreset="all">everything</button><button class="small" data-spreset="none">none</button>' +
    `<input type="text" data-sfilter placeholder="filter sensors (VRM, DIMM, fan …)" value="${esc(state.sensorFilter || '')}" style="min-width:220px"></div>`;
  const units = [...new Set(sel.map(d => d[2]))];
  const byUnit = {}; defs.forEach(d => (byUnit[d[2]] ??= []).push(d));
  html += '<div class="serlist" style="max-height:220px">' + Object.entries(byUnit).map(([u, ds]) =>
    `<div style="flex:1 1 100%;color:var(--dim);font-size:12px;margin-top:4px">${esc(u || 'other')}</div>` + ds.map(d => {
      const i = defs.indexOf(d), on = sel.includes(d), st = seriesStyle(i);
      const hide = q && !d[1].toLowerCase().includes(q) ? 'style="display:none"' : '';
      return `<label class="chip ${on ? 'on' : ''}" data-sname="${esc(d[1].toLowerCase())}" ${hide}><input type="checkbox" data-ssel="${esc(d[0])}" ${on ? 'checked' : ''}>${swatch(st.color, 'circle', on ? DASHES[units.indexOf(d[2]) % DASHES.length] : '')}${esc(d[1])}</label>`;
    }).join('')).join('') + '</div>';
  // test phases as background bands
  const phases = sec.phases || [];
  const kindsSeen = [...new Set(phases.map(p => p.kind))];
  if (phases.length) {
    html += '<div class="row"><b>Test backgrounds:</b>' + kindsSeen.map(k =>
      `<label class="chk"><input type="checkbox" data-pkind="${esc(k)}" ${state.phaseHidden.has(k) ? '' : 'checked'}><span class="sw" style="background:${phaseColor(k)}"></span>${esc(PHASE_NAMES[k] || k)} (${phases.filter(p => p.kind === k).length})</label>`).join('') +
      `<label class="chk">opacity <input type="range" min="0" max="60" value="${Math.round(state.phaseOpacity * 100)}" data-popacity style="width:120px"> <span data-popv>${Math.round(state.phaseOpacity * 100)} %</span></label>` +
      '<span style="color:var(--dim);font-size:12px">hover a band to see which test ran</span></div>';
    const keys = phaseKeys(phases);
    html += '<details><summary>Test colours (one shade per test)</summary>' + kindsSeen.map(k => `<div class="row"><b>${esc(PHASE_NAMES[k] || k)}:</b>` +
      keys[k].map((t, i) => `<span class="chk"><span class="sw" style="background:${phaseShade(k, i, keys[k].length)}"></span>${esc(t)}</span>`).join('') + '</div>').join('') + '</details>';
  }
  if (units.length > 1) html += '<div style="color:var(--dim);font-size:12px">Each unit has its own axis (first on the left, others on the right); lines on different axes use different dash patterns.</div>';
  const axes = units.map(u => ({ unit: u, label: sel.filter(d => d[2] === u).map(d => d[1]).slice(0, 2).join(' · ') + (sel.filter(d => d[2] === u).length > 2 ? ' …' : '') + ` (${u})` }));
  const lines = sel.map(d => {
    const st = seriesStyle(defs.indexOf(d));
    return { series: d[1], metric: d[1], unit: d[2], name: d[1], color: st.color, shape: 'circle', dash: DASHES[units.indexOf(d[2]) % DASHES.length], axis: units.indexOf(d[2]), pts: tl.filter(p => sensorValue(p, d[0]) != null).map(p => [p.t_s, sensorValue(p, d[0])]) };
  });
  const pkeys = phaseKeys(phases);
  const bands = phases.filter(p => !state.phaseHidden.has(p.kind)).map(p => {
    const ks = pkeys[p.kind] || [], i = Math.max(0, ks.indexOf(phaseKey(p)));
    return { x0: p.t0_s, x1: Math.max(p.t1_s, p.t0_s + 0.05), color: phaseShade(p.kind, i, ks.length), label: p.label };
  });
  const cid = 'chart_sensors';
  pendingSpecs.set(cid, { id: cid, lines, axes, bands, legend: sel.length > 1 && sel.length <= 12 ? lines.map(l => ({ label: l.name + ' (' + l.unit + ')', color: l.color, dash: l.dash, axis: l.axis })) : null, ysig: sel.map(d => d[0]).join('|'), xLabel: 'seconds since the test started', logY: false, zeroY: false, markers: false, xFmt: v => fmt(v) + ' s' });
  html += chartTools(cid) + `<div class="chartbox big" data-chart="${cid}"></div>`;
  const progs = (sec.programs || []).filter(p => p.cpu_avg_pct >= 0.1 || p.gpu_avg_pct >= 0.1);
  if (sec.programs) {
    html += '<h3>Other programs while the tests ran</h3>' + (progs.length
      ? '<div style="color:var(--dim);font-size:12px">Share of the whole CPU (100 % = every core busy) and of the GPU\'s busiest engine, averaged over the run. Anything busy here competed with the tests; the rows of the tests it overlapped say so under "unusual values".</div>' +
        `<div class="scroll" style="max-height:300px"><table><thead><tr><th>Program</th><th>CPU avg %</th><th>CPU max %</th><th>GPU avg %</th><th>GPU max %</th></tr></thead><tbody>` +
        progs.map(p => `<tr><td>${esc(p.name)}</td><td class="${p.cpu_avg_pct >= 5 ? 'warn' : ''}">${fmt(p.cpu_avg_pct)}</td><td>${fmt(p.cpu_max_pct)}</td><td class="${p.gpu_avg_pct >= 5 ? 'warn' : ''}">${fmt(p.gpu_avg_pct)}</td><td>${fmt(p.gpu_max_pct)}</td></tr>`).join('') + '</tbody></table></div>'
      : '<div style="color:var(--dim);font-size:12px">✓ No other program used a noticeable share of the CPU or GPU.</div>');
  }
  const peaks = sec.core_peak_temps_c || [];
  if (peaks.length) {
    html += '<h3>Peak temperature per core</h3><div class="row">' + peaks.map(p => { const t = p[1], c = t > 85 ? 'bad' : t > 70 ? 'warn' : 'ok'; return `<span class="badge ${c === 'ok' ? 'ok' : c === 'warn' ? 'warn' : 'bad'}">core ${p[0]}: ${t.toFixed(0)} °C</span>`; }).join('') + '</div>';
  }
  // peak / average of every sensor over the whole run
  if (defs.length) {
    const rows = defs.map(d => { const v = tl.map(p => sensorValue(p, d[0])).filter(x => x != null); return v.length ? [d, Math.min(...v), v.reduce((a, b) => a + b, 0) / v.length, Math.max(...v)] : null; }).filter(Boolean);
    html += `<details><summary>Min / average / max of every sensor (${rows.length})</summary><div class="scroll" style="max-height:360px"><table><thead><tr><th>Sensor</th><th>Unit</th><th>Min</th><th>Average</th><th>Max</th></tr></thead><tbody>` +
      rows.map(r => `<tr><td>${esc(r[0][1])}</td><td>${esc(r[0][2])}</td><td>${fmt(r[1])}</td><td>${fmt(r[2])}</td><td>${fmt(r[3])}</td></tr>`).join('') + '</tbody></table></div></details>';
  }
  return html + '</div>';
}

function virtSection(v) {
  const rows = [];
  if (v.bios) rows.push(['BIOS VT-x / SVM', v.bios.vt_x_enabled || v.bios.svm_enabled], ['IOMMU / VT-d', v.bios.iommu_enabled], ['Secure Boot', v.bios.secure_boot_enabled], ['TPM', v.bios.tpm_enabled]);
  if (v.windows) rows.push(['Hyper-V / hypervisor', v.windows.hyper_v_enabled], ['VBS', v.windows.vbs_enabled], ['Memory integrity (HVCI)', v.windows.hvci_enabled], ['WSL', v.windows.wsl_enabled], ['Virtual Machine Platform', v.windows.virtual_machine_platform_enabled]);
  if (v.linux) rows.push(['KVM', v.linux.kvm_enabled]);
  return `<h2>Virtualization</h2><div class="card"><div class="grid">${rows.map(r => `<span class="k">${esc(r[0])}</span><span class="${r[1] ? 'warn' : 'ok'}">${r[1] ? 'enabled' : 'disabled'}</span>`).join('')}</div>` +
    (v.recommendations && v.recommendations.length ? '<h3>Notes</h3>' + v.recommendations.map(x => `<div style="font-size:13px">• ${esc(x)}</div>`).join('') : '') + '</div>';
}

function overview(doc, name, meta) {
  const s = (doc.payload || {}).system_info || {}, c = s.cpu || {}, m = s.memory || {}, o = s.os || {}, b = s.motherboard || {}, h = doc.header || {};
  const gpus = (s.gpus && s.gpus.length ? s.gpus : (s.gpu ? [s.gpu] : []));
  const mods = (m.modules || []).map(x => `${humanSize(x.size)} ${x.speed ? x.speed + ' MT/s' : ''} ${x.part_number && x.part_number !== 'Unknown' ? x.part_number : ''}`.trim());
  const cache = c.l3_cache ? `L1d ${c.l1_cache} KB · L2 ${c.l2_cache} KB · L3 ${c.l3_cache} KB` : '';
  const grid = [
    ['CPU', `${c.brand && c.brand !== 'Unknown' ? c.brand : c.name} — ${c.cores} cores / ${c.threads} threads` + (c.e_cores ? ` (P ${c.p_cores} + E ${c.e_cores})` : '')],
    cache && ['Cache', cache],
    ['Memory', `${(m.total / 2**30).toFixed(1)} GB ${m.type_ && m.type_ !== 'Unknown' ? m.type_ : ''} ${m.speed ? m.speed + ' MT/s' : ''}` + (mods.length ? ' — ' + mods.join(' + ') : '')],
    ...gpus.map((g, i) => [i ? '' : 'GPU', `${g.name} — ${g.vram_total ? humanSize(g.vram_total) + ' · ' : ''}driver ${g.driver_version}`]),
    ['Board / BIOS', `${b.manufacturer} ${b.model}${b.chipset && b.chipset !== 'Unknown' ? ' (' + b.chipset + ')' : ''} · BIOS ${b.bios_version} (${b.bios_date})`],
    ['OS', `${o.name} ${o.version} · build ${o.build}`],
    ['App', `v${h.app_version} · hash ${(h.app_hash || '').slice(0, 16)}…`],
    ['Recorded', h.timestamp],
    ['Signature', `${(doc.signature.sig || '').slice(0, 24)}… (key ${(doc.signature.public_key || '').slice(0, 12)}…)`],
  ].filter(Boolean);
  const status = meta && meta.valid === true ? (meta.trusted === false ? '<span class="badge ok" title="The data matches its signature, but the signing key is not the key stored next to these results (for example a file from another computer).">✓ signature intact · other computer\'s key</span>' : '<span class="badge ok">✓ signed by this computer</span>') : meta && meta.valid === false ? `<span class="badge bad">✗ ${esc(meta.message)}</span>` : '<span class="badge warn">not verified in this view</span>';
  return `<div class="card"><div class="row"><b style="font-size:16px">${esc(doc.payload.test_type)}</b> ${status}<span style="flex:1"></span><button data-act="raw">Raw JSON</button><button data-act="dl-json">Download JSON</button></div><div class="grid">${grid.map(r => `<span class="k">${esc(r[0])}</span><span>${esc(r[1])}</span>`).join('')}</div></div>`;
}

let lastRender = null;
const KIND_ORDER = ['memory', 'cpu', 'gpu', 'gpu3d', 'gpu3d_frames', 'input_timing_suite', 'input_trials', 'mouse_polling', 'reflex_game'];
const entriesFor = k => lastRender.perDoc.filter(p => p.sections[k]).map(p => ({ label: p.label, sec: p.sections[k] }));

function render() {
  const main = $('#main');
  liveCharts.forEach(c => c.destroy()); liveCharts.clear(); pendingSpecs.clear();
  if (!state.selected.length) { main.innerHTML = '<div id="empty">Select a result on the left.</div>'; return; }
  const docs = state.selected.map(n => [n, state.docs.get(n)]).filter(d => d[1]);
  let html = '';
  if (docs.length > 1) html += `<div class="card">Comparing ${docs.length} results: overlaid lines are prefixed with their date. Column and line switches apply to all.</div>`;
  else html += overview(docs[0][1], docs[0][0], state.list.find(m => m.name === docs[0][0]));
  const perDoc = docs.map(([n, d]) => ({ label: docLabel(d, n), sections: sectionsOf(d), doc: d }));
  lastRender = { built: [], docs, perDoc };
  html += `<div class="row"><b>Time unit for every table and chart:</b>` + Object.keys(TIME_UNITS).map(u =>
    `<label class="chk"><input type="radio" name="tunit" data-tunit="${u}" ${state.timeUnit === u ? 'checked' : ''}>${u}</label>`).join('') +
    '<span style="color:var(--dim);font-size:12px">saved values are in nanoseconds (or f64 milliseconds for GPU / input), shown here in one unit so every run compares directly</span></div>';
  for (const k of KIND_ORDER) {
    const entries = entriesFor(k);
    if (entries.length) { const b = kindSection(k, entries); html += `<section id="ks_${k}">${b.html}</section>`; lastRender.built.push(b); }
  }
  const sens = entriesFor('sensors');
  if (sens.length) html += `<section id="ks_sensors">${sensorsSection(sens)}</section>`;
  const virt = perDoc.find(p => p.sections.virtualization);
  if (virt && docs.length === 1) html += virtSection(virt.sections.virtualization);
  if (!lastRender.built.length && !sens.length && !virt) html += '<div class="card">This file has no chartable results.</div>';
  main.innerHTML = html;
  KIND_ORDER.forEach(k => { const h = $('#ks_' + k); if (h) wireKind(h, k); });
  const sh = $('#ks_sensors'); if (sh) wireSensors(sh);
  wirePage();
}

// Re-render one section only: keeps the scroll position and does not rebuild the other big tables
function rebuildSection(k) {
  const host = $('#ks_' + k); if (!host) return render();
  liveCharts.get('chart_' + k)?.destroy(); liveCharts.delete('chart_' + k);
  if (k === 'sensors') { host.innerHTML = sensorsSection(entriesFor('sensors')); wireSensors(host); return; }
  const b = kindSection(k, entriesFor(k)), i = lastRender.built.findIndex(x => x.kindKey === k);
  if (i >= 0) lastRender.built[i] = b;
  host.innerHTML = b.html; wireKind(host, k);
}

function wireKind(host, kindKey) {
  const card = host.querySelector('.card[id^=sec_]'); if (!card) return;
  const b = lastRender.built.find(x => x.kindKey === kindKey), redo = () => rebuildSection(kindKey);
  card.querySelectorAll('[data-ser]').forEach(el => el.onchange = () => { const k = kindKey + ':' + el.dataset.ser; el.checked ? state.hiddenSeries.delete(k) : state.hiddenSeries.add(k); redo(); });
  // a whole row (test) or column (thread count): all shown -> hide them, otherwise show them all
  const toggleGroup = pick => {
    const group = b.series.filter(s => pick(splitSeries(s)));
    const allOn = group.every(s => !state.hiddenSeries.has(kindKey + ':' + s));
    group.forEach(s => allOn ? state.hiddenSeries.add(kindKey + ':' + s) : state.hiddenSeries.delete(kindKey + ':' + s));
    redo();
  };
  card.querySelectorAll('[data-serrow]').forEach(el => el.onclick = () => toggleGroup(p => p.base === el.dataset.serrow));
  card.querySelectorAll('[data-sercol]').forEach(el => el.onclick = () => toggleGroup(p => p.col === el.dataset.sercol));
  card.querySelectorAll('[data-col]').forEach(el => el.onchange = () => { const k = kindKey + ':' + el.dataset.col; el.checked ? state.hiddenCols.delete(k) : state.hiddenCols.add(k); redo(); });
  card.querySelectorAll('[data-opt]').forEach(el => el.onchange = () => { optsOf(kindKey)[el.dataset.opt] = el.checked; redo(); });
  card.querySelectorAll('[data-mchip]').forEach(el => el.onchange = () => {
    const cur = new Set([...card.querySelectorAll('[data-mchip]:checked')].map(x => x.dataset.mchip));
    if (!cur.size) cur.add(el.dataset.mchip);              // at least one value stays on the chart
    state.chartMetrics[kindKey] = [...cur]; redo();
  });
  const flt = card.querySelector('[data-serfilter]');
  if (flt) flt.oninput = () => {
    const q = flt.value.trim().toLowerCase(); state.filters[kindKey] = flt.value;
    card.querySelectorAll('[data-serlabel]').forEach(l => l.style.display = !q || l.dataset.serlabel.includes(q) ? '' : 'none');
  };
  card.querySelectorAll('[data-act]').forEach(el => el.onclick = () => {
    const a = el.dataset.act, isTel = k => TELEMETRY.some(t => t[0] === k), q = (state.filters[kindKey] || '').trim().toLowerCase();
    const match = s => !q || s.toLowerCase().includes(q);
    if (a === 'ser-all') b.series.filter(match).forEach(s => state.hiddenSeries.delete(kindKey + ':' + s));
    if (a === 'ser-none') b.series.filter(match).forEach(s => state.hiddenSeries.add(kindKey + ':' + s));
    if (a === 'ser-only') b.series.forEach(s => match(s) ? state.hiddenSeries.delete(kindKey + ':' + s) : state.hiddenSeries.add(kindKey + ':' + s));
    if (a === 'col-all') b.metrics.forEach(m => state.hiddenCols.delete(kindKey + ':' + m[0]));
    if (a === 'col-none') b.metrics.forEach(m => state.hiddenCols.add(kindKey + ':' + m[0]));
    if (a === 'col-perf') b.metrics.forEach(m => isTel(m[0]) ? state.hiddenCols.add(kindKey + ':' + m[0]) : state.hiddenCols.delete(kindKey + ':' + m[0]));
    if (a === 'col-sens') b.metrics.forEach(m => isTel(m[0]) ? state.hiddenCols.delete(kindKey + ':' + m[0]) : state.hiddenCols.add(kindKey + ':' + m[0]));
    const rows = b.rows.filter(r => !state.hiddenSeries.has(kindKey + ':' + r.series)), cols = b.metrics.filter(m => !state.hiddenCols.has(kindKey + ':' + m[0]));
    if (a === 'csv') { navigator.clipboard && navigator.clipboard.writeText(toCsv(rows, cols)); el.textContent = 'Copied'; return; }
    if (a === 'dl-csv') { download(kindKey + '.csv', toCsv(rows, cols), 'text/csv'); return; }
    redo();
  });
  mountCharts(card);
}

function wireSensors(host) {
  const defs = () => sensorDefs(entriesFor('sensors')[0].sec);
  host.querySelectorAll('[data-spreset]').forEach(el => el.onclick = () => {
    const k = el.dataset.spreset;
    state.sensorSel = new Set(defs().filter(d => k === 'all' ? true : k === 'none' ? false : SENSOR_PRESETS[k][1](d)).map(d => d[0]));
    rebuildSection('sensors');
  });
  host.querySelectorAll('[data-ssel]').forEach(el => el.onchange = () => {
    const cur = new Set([...host.querySelectorAll('[data-ssel]:checked')].map(x => x.dataset.ssel));
    if (!cur.size) cur.add(el.dataset.ssel);
    state.sensorSel = cur; rebuildSection('sensors');
  });
  const f = host.querySelector('[data-sfilter]');
  if (f) f.oninput = () => {
    state.sensorFilter = f.value; const q = f.value.trim().toLowerCase();
    host.querySelectorAll('[data-sname]').forEach(l => l.style.display = !q || l.dataset.sname.includes(q) ? '' : 'none');
  };
  host.querySelectorAll('[data-pkind]').forEach(el => el.onchange = () => { el.checked ? state.phaseHidden.delete(el.dataset.pkind) : state.phaseHidden.add(el.dataset.pkind); rebuildSection('sensors'); });
  const op = host.querySelector('[data-popacity]');
  if (op) op.oninput = () => {
    state.phaseOpacity = op.value / 100; host.querySelector('[data-popv]').textContent = op.value + ' %';
    liveCharts.get('chart_sensors')?.draw();
  };
  mountCharts(host);
}

function wirePage() {
  document.querySelectorAll('[data-tunit]').forEach(el => el.onchange = () => { state.timeUnit = el.dataset.tunit; render(); });
  const raw = $('[data-act=raw]'); if (raw) raw.onclick = () => { const d = lastRender.docs[0][1]; const pre = document.createElement('pre'); pre.textContent = JSON.stringify(d, null, 2); raw.closest('.card').appendChild(pre); raw.disabled = true; };
  const dj = $('[data-act=dl-json]'); if (dj) dj.onclick = () => download(lastRender.docs[0][0].replace(/[^\w.-]/g, '_'), JSON.stringify(lastRender.docs[0][1], null, 2), 'application/json');
}

$('#typeFilter').onchange = renderList;
$('#btnRefresh').onclick = () => { state.docs.clear(); loadList(); };
loadList().catch(e => { $('#main').innerHTML = `<div id="empty" class="bad">Could not load results: ${esc(e.message)}</div>`; });
</script>
